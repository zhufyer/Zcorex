<svg xmlns="http://www.w3.org/2000/svg" width="920" height="270" viewBox="0 0 920 270" role="img" aria-label="Zcorex Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172036"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.9"/>
    </pattern>
  </defs>

  <rect width="920" height="270" rx="18" fill="url(#bg)"/>
  <rect width="920" height="270" rx="18" fill="url(#grid)" opacity="0.45"/>
  <rect x="0" y="0" width="920" height="5" rx="2.5" fill="url(#accent)"/>

  <!-- Larger Hex Logo -->
  <g transform="translate(42, 62)">
    <polygon points="68,4 128,38 128,106 68,140 8,106 8,38" fill="#0b1220" stroke="url(#logoGrad)" stroke-width="4.5"/>
    <path d="M40 46 H96 L44 98 H96" fill="none" stroke="url(#logoGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title & Badge -->
  <text x="202" y="108" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="3" fill="#f8fafc">ZCOREX</text>
  <rect x="462" y="69" width="186" height="34" rx="17" fill="#082f49" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="555" y="91" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" fill="#38bdf8">WEB ENGINE KERNEL</text>

  <!-- Subtitle -->
  <text x="202" y="146" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="500" fill="#cbd5e1">Ultra-lightweight, zero-GC Rust web engine core · SIMD geometry</text>
  <text x="202" y="172" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" fill="#94a3b8">Arena DOM + WebIDL / CSSOM · Hand-written x86_64 &amp; ARM64 asm! VM</text>

  <!-- Large Pills -->
  <g transform="translate(202, 198)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13.5" font-weight="700">
    <rect x="0" y="0" width="108" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="54" y="22" text-anchor="middle" fill="#e2e8f0">Rust 2021</text>

    <rect x="118" y="0" width="132" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="184" y="22" text-anchor="middle" fill="#38bdf8">718 KiB Core</text>

    <rect x="260" y="0" width="150" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="335" y="22" text-anchor="middle" fill="#34d399">2.8 MiB Flat RSS</text>

    <rect x="420" y="0" width="144" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="492" y="22" text-anchor="middle" fill="#fb923c">120.9k WPT</text>

    <rect x="574" y="0" width="114" height="34" rx="8" fill="#271a14" stroke="#9a3412" stroke-width="1.2"/>
    <text x="631" y="22" text-anchor="middle" fill="#fdba74">🔒 Closed</text>
  </g>
</svg>
