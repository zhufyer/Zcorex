<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img" aria-label="Zcorex Banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#172036"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="820" height="250" rx="18" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect x="0" y="0" width="820" height="6" rx="3" fill="url(#accent)"/>

  <!-- Bold Hex Logo -->
  <g transform="translate(34, 54)">
    <polygon points="66,4 124,37 124,103 66,136 8,103 8,37" fill="#0b1220" stroke="url(#logoGrad)" stroke-width="5"/>
    <path d="M38 45 H94 L42 95 H94" fill="none" stroke="url(#logoGrad)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Large Title & Badge -->
  <text x="188" y="102" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="2.5" fill="#ffffff">ZCOREX</text>
  <rect x="444" y="63" width="194" height="36" rx="18" fill="#082f49" stroke="#38bdf8" stroke-width="2"/>
  <text x="541" y="86" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800" fill="#7dd3fc">WEB ENGINE KERNEL</text>

  <!-- Clear Subtitle -->
  <text x="188" y="142" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#e2e8f0">Zero-GC Rust web engine · SIMD geometry · x86_64/ARM64 asm! VM</text>

  <!-- Bold Pills -->
  <g transform="translate(188, 174)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="800">
    <rect x="0" y="0" width="106" height="38" rx="9" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="53" y="24" text-anchor="middle" fill="#f8fafc">Rust 2021</text>

    <rect x="116" y="0" width="128" height="38" rx="9" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="180" y="24" text-anchor="middle" fill="#38bdf8">718 KiB Core</text>

    <rect x="254" y="0" width="144" height="38" rx="9" fill="#1e293b" stroke="#16a34a" stroke-width="1.5"/>
    <text x="326" y="24" text-anchor="middle" fill="#4ade80">2.8 MiB RSS</text>

    <rect x="408" y="0" width="192" height="38" rx="9" fill="#2b1c10" stroke="#ea580c" stroke-width="1.5"/>
    <text x="504" y="24" text-anchor="middle" fill="#fdba74">🔒 Closed Source</text>
  </g>
